[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "regen-protocol"
version = "0.1.0"
description = "Stateless reference runtime for REGEN Protocol V0"
requires-python = ">=3.12"
dependencies = [
  "openai==3.13.0",
  "jsonschema[format]>=4.26,<5",
  "fastapi>=0.141.1,<0.142",
  "uvicorn>=0.52.4,<0.53",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17", "httpx>=0.28,<0.29"]

[tool.setuptools.packages.find]
include = ["regen_protocol*"]

[tool.setuptools.data-files]
"share/regen-protocol/protocol/v0" = ["protocol/v0/incident.schema.json", "protocol/v0/decision.schema.json"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
